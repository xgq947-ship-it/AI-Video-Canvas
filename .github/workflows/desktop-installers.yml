name: Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            command: npm run desktop:dist:mac
            artifact: evan-macos-arm64
          - name: Windows x64
            os: windows-latest
            command: npm run desktop:dist:win
            artifact: evan-windows-x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装 Node 依赖
        run: npm ci

      - name: 准备目标平台 Python 与 Chromium
        run: npm run setup:browser-models

      - name: 回归测试
        run: npm test

      - name: 构建安装介质
        run: ${{ matrix.command }}

      - name: 上传安装产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
